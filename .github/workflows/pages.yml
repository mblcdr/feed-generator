# Publishes the static site in site/ to GitHub Pages on every push to main that touches it.
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fill in the repository name
        run: |
          repo="${GITHUB_REPOSITORY}"
          lower="$(echo "$repo" | tr '[:upper:]' '[:lower:]')"
          sed -i -e "s#__REPO_LC__#${lower}#g" -e "s#__NAME__#${repo##*/}#g" -e "s#__REPO__#${repo}#g" site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
